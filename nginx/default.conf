server {
    listen 80;
    server_name _;

    location = / {
        default_type text/html;
        return 200 '<!doctype html><html><head><title>Project starters</title></head><body><h1>Project starters</h1><ul><li><a href="/nestjs/">NestJS</a></li><li><a href="/react/">React</a></li><li><a href="/rust-axum-api/">Rust Axum API</a></li><li><a href="/rust-axum-service/">Rust Axum service</a></li><li><a href="/nextjs/">Next.js</a></li></ul></body></html>';
    }

    location = /nestjs { return 308 /nestjs/; }
    location /nestjs/ {
        proxy_pass http://nestjs-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /react { return 308 /react/; }
    location /react/ {
        proxy_pass http://react-app:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /rust-axum-api { return 308 /rust-axum-api/; }
    location /rust-axum-api/ {
        proxy_pass http://rust-axum-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /rust-axum-service { return 308 /rust-axum-service/; }
    location /rust-axum-service/ {
        proxy_pass http://rust-axum-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /nextjs { return 308 /nextjs/; }
    location /nextjs/ {
        proxy_pass http://nextjs-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}