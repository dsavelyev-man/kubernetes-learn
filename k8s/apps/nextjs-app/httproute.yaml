apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextjs-app
  namespace: apps
spec:
  parentRefs:
    - name: apps
      sectionName: http
  hostnames:
    - apps.dsavelyev.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /nextjs
      backendRefs:
        - name: nextjs-app
          port: 3000
