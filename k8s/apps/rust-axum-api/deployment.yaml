apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-axum-api
  namespace: "apps"
spec:
  selector:
    matchLabels:
      app: rust-axum-api
  template:
    metadata:
      labels:
        app: rust-axum-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rust-axum-api
          image: ghcr.io/dsavelyev-man/rust-axum-api:latest
          imagePullPolicy: "Always"
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "256Mi"
              cpu: "1"
            requests:
              memory: 256Mi
              cpu: "0.2"
