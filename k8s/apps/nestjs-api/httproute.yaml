apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nestjs-api
  namespace: apps
spec:
  parentRefs:
    - name: apps
      sectionName: http
  hostnames:
    - apps.dsavelyev.ru
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /nestjs
      backendRefs:
        - name: nestjs-api
          port: 3000
