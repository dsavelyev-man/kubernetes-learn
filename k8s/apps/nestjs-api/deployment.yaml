apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-api
  namespace: "apps"
spec:
  selector:
    matchLabels:
      app: nestjs-api
  template:
    metadata:
      labels:
        app: nestjs-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nestjs-api
          image: ghcr.io/dsavelyev-man/nestjs-api:latest
          imagePullPolicy: "Always"
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "256Mi"
              cpu: "1"
            requests:
              memory: 256Mi
              cpu: "0.2"
