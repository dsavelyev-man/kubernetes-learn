apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: {{ .Values.gateway.listenerName }}
      hostname: {{ .Values.gateway.hostname | quote }}
      port: {{ .Values.gateway.port }}
      protocol: HTTP