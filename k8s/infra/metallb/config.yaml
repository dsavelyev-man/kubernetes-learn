apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: envoy-gateway-pool
  namespace: default
spec:
  addresses:
    - 192.168.49.240-192.168.49.250
  autoAssign: true
  serviceAllocation:
    namespaces:
      - default
    serviceSelectors:
      - matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: kubeview-gateway
          gateway.envoyproxy.io/owning-gateway-namespace: apps
      - matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: apps
          gateway.envoyproxy.io/owning-gateway-namespace: apps
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: envoy-gateway-pool
  namespace: default
spec:
  ipAddressPools:
    - envoy-gateway-pool
