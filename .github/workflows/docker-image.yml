name: Docker Image CI

on:
  push:
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    
env:
  REGISTRY: ghcr.io
  
jobs:
  build:
    strategy:
      matrix:
        project: [nestjs-api, react-app, rust-axum-api, rust-axum-service, nextjs-app]
        platform:
          - { runner: ubuntu-latest, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform variables
        id: prep
        run: |
          platform="${{ matrix.platform.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.project }}
          platforms: ${{ matrix.platform.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.project }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.project }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}-${{ steps.prep.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.project }}-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
