name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build and push nestjs-api
      run: docker build --file ./nestjs-api/Dockerfile --tag nestjs-api:0.0.1
