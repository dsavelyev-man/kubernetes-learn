services:
  nestjs-api:
    image: ghcr.io/dsavelyev-man/kubernetes-learn/nestjs-api:0.0.1
    build:
      context: ./nestjs-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  react-app:
    image: ghcr.io/dsavelyev-man/kubernetes-learn/react-app:0.0.1
    build:
      context: ./react-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"

  rust-axum-api:
    image: ghcr.io/dsavelyev-man/kubernetes-learn/rust-axum-api:0.0.1
    build:
      context: ./rust-axum-api
      dockerfile: Dockerfile
    ports:
      - "3001:3000"

  rust-axum-service:
    image: ghcr.io/dsavelyev-man/kubernetes-learn/rust-axum-service:0.0.1
    build:
      context: ./rust-axum-service
      dockerfile: Dockerfile
    ports:
      - "3002:3001"

  nextjs-app:
    image: ghcr.io/dsavelyev-man/kubernetes-learn/nextjs-app:0.0.1
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
